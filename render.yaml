services:
  # FastAPI Backend Web Service
  - type: web
    name: mealloop-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.5
      - key: ENVIRONMENT
        value: production
      - key: PROJECT_NAME
        value: MealLoop API
      - key: DATABASE_URL
        sync: false # Input your Neon PostgreSQL connection string here
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: DISABLE_SQLALCHEMY_CEXT
        value: 1
      - key: BACKEND_CORS_ORIGINS
        value: "https://*.vercel.app,http://localhost:3000"
