version: '3.8'

services:
  # 1. PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: mealloop_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mealloop}
      POSTGRES_USER: ${POSTGRES_USER:-mealloop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mealloop_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mealloop} -d ${POSTGRES_DB:-mealloop}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. FastAPI Backend Application
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mealloop_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PROJECT_NAME: "MealLoop API"
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-mealloop}:${POSTGRES_PASSWORD:-mealloop_secret}@db:5432/${POSTGRES_DB:-mealloop}
      SECRET_KEY: ${SECRET_KEY:-mealloop_production_super_secret_jwt_key_2026}
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      BACKEND_CORS_ORIGINS: '["http://localhost:3000","http://localhost:80","http://127.0.0.1:3000","http://127.0.0.1:80"]'
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # 3. React Frontend Application (Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mealloop_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
    driver: local
